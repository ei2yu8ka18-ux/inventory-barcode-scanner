<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#059669">
  <title>JANコード読み取り</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;background:#f3f4f6;color:#1f2937}
    main{max-width:560px;margin:auto;background:white;border-radius:18px;padding:16px;box-shadow:0 4px 18px #0001}
    h1{font-size:20px;margin:0 0 8px}
    p{font-size:13px;line-height:1.65;color:#4b5563}
    #reader{width:100%;margin:14px auto;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#111}
    #reader video{object-fit:contain}
    #message{padding:12px;border-radius:10px;background:#ecfdf5;color:#065f46;font-size:13px;min-height:44px}
    button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:12px;background:#059669;color:white;font-size:15px;font-weight:bold}
    button.secondary{background:#e5e7eb;color:#374151}
    .small{font-size:11px;color:#6b7280}
    .tips{background:#f9fafb;border-radius:10px;padding:10px 12px;margin-top:10px}
  </style>
</head>
<body>
<main>
  <h1>📷 JANコード読み取り</h1>
  <p>商品のバーコード全体を枠内に入れてください。ピントが合ってから読み取ります。</p>
  <div id="message">カメラを起動しています。ブラウザからカメラの使用を許可してください。</div>
  <div id="reader"></div>
  <div class="tips">
    <p style="margin:0"><strong>読み取れないとき</strong><br>
      ・スマートフォンを商品から<strong>15～20cm程度</strong>離す<br>
      ・バーコードとカメラを平行にし、バーコード全体を映す<br>
      ・明るい場所で、照明の反射が入らないようにする<br>
      ・カメラのレンズを拭き、ピントが合うまで少し待つ</p>
  </div>
  <button class="secondary" type="button" onclick="location.reload()">カメラを再起動</button>
  <p class="small">カメラ映像自体がぼやける場合は、iPhone標準の「カメラ」アプリでも同じ距離でピントが合うか確認してください。</p>
</main>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const returnUrl = params.get('return') || '';
  const message = document.getElementById('message');

  // 戻り先はGoogle Apps ScriptのWebアプリURLに限定
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(returnUrl)) {
    message.textContent = '戻り先URLが正しくありません。在庫管理画面から読み取りボタンを押してください。';
    return;
  }
  if (!window.Html5Qrcode) {
    message.textContent = '読み取りライブラリを読み込めませんでした。通信環境を確認して再読み込みしてください。';
    return;
  }

  const scanner = new Html5Qrcode('reader');
  let completed = false;

  // 読み取り枠を画面幅に合わせて広げ、JANコード全体を捉えやすくする
  const config = {
    fps: 15,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      return {
        width: Math.max(240, Math.floor(viewfinderWidth * 0.96)),
        height: Math.max(120, Math.floor(viewfinderHeight * 0.72))
      };
    },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E
    ]
  };

  Html5Qrcode.getCameras().then(cameras => {
    if (!cameras || !cameras.length) throw new Error('利用できるカメラが見つかりません。');

    // 背面カメラを優先。解像度は可能な範囲で高くする。
    const back = cameras.find(c => /back|rear|environment|背面/i.test(c.label));
    config.videoConstraints = back
      ? { deviceId: { exact: back.id }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      : { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } };

    message.textContent = '背面カメラで読み取り中です。バーコードを15～20cm程度離して映してください。';
    return scanner.start(back ? back.id : { facingMode: 'environment' }, config, decodedText => {
      if (completed) return;
      const jan = String(decodedText || '').replace(/[^0-9]/g, '');
      if (![8,12,13,14].includes(jan.length)) {
        message.textContent = 'JANコードとして認識できませんでした。バーコード全体を枠内に合わせてください。';
        return;
      }
      completed = true;
      message.textContent = '読み取り成功：' + jan + '　在庫管理画面へ戻ります…';
      scanner.stop().catch(() => {}).finally(() => {
        const target = new URL(returnUrl);
        target.searchParams.set('jan', jan);
        location.href = target.toString();
      });
    }, () => {});
  }).then(() => {
    // focusModeを公開しているブラウザでのみ連続オートフォーカスを要求する。
    // iOS Safariなど未対応環境では標準のカメラオートフォーカスに任せる。
    try {
      const capabilities = scanner.getRunningTrackCapabilities();
      if (capabilities && capabilities.focusMode) {
        scanner.applyVideoConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
      }
    } catch (e) {}
  }).catch(err => {
    message.textContent = 'カメラを起動できませんでした：' + (err && err.message ? err.message : err) + '。Safariのカメラ許可とHTTPS接続を確認してください。';
  });
})();
</script>
</body>
</html>
